# Turns a version bump in plugins/delab-coding-practices/.claude-plugin/plugin.json
# into a GitHub release. Runs on every push to `main` on GitHub, which today
# means every run of the GitLab -> GitHub mirror cron job, not a push made
# here directly. Most of those pushes don't touch the version, so tag-exists
# (scripts/release_version.py) must make an unbumped push a silent no-op
# rather than a duplicate-tag failure.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need every tag, not just the tip commit, for tag-exists below.
          fetch-depth: 0

      - name: Compute release tag from plugin.json
        id: tag
        run: echo "tag=$(python3 scripts/release_version.py current-tag)" >> "$GITHUB_OUTPUT"

      - name: Create the release if this version hasn't been tagged yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if python3 scripts/release_version.py tag-exists "$TAG" $(git tag); then
            echo "$TAG already released; nothing to do."
          else
            # --generate-notes drafts the body from commits/PRs since the
            # previous tag; with no previous tag at all (the mirror's first
            # run) GitHub's API covers everything up to HEAD instead of
            # erroring, so the "no prior release" case needs no special code
            # here.
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
